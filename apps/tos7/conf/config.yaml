http:
  port: 18742
  listen: "127.0.0.1"
  # The TOS platform strips /v2/proxy/filebrowser-quantum before forwarding
  # requests to the Unix socket. The local proxy restores this prefix so the
  # upstream SPA, API, assets and WebSocket all share one working base path.
  baseURL: "/v2/proxy/filebrowser-quantum/"
  trustProxyHeaders: true

server:
  logging:
    - levels: "info|error|warning"
      output: "stdout"
  cacheDir: "/usr/local/filebrowser-quantum/data/cache"
  database:
    path: "/usr/local/filebrowser-quantum/data/filebrowser.sqlite"
  sources:
    - path: "/usr/local/filebrowser-quantum/data/files"
      name: "App Files"
      config:
        defaultEnabled: true
        defaultPermissions:
          view: true
          download: true
          modify: true
          delete: true
          create: true

auth:
  adminUsername: admin
  methods:
    password:
      enabled: true
      minLength: 5
      signup: false

frontend:
  name: "FileBrowser Quantum"
