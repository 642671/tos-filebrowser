http:
  port: 18742
  listen: "127.0.0.1"
  # The TOS wrapper serves the application on its own portal subpath through
  # nginx. This is intentionally not /v2/proxy/<appid>/: a browser iframe
  # navigation cannot send the platform X-Csrf-Token header required by that
  # route, so TOS rejects it with HTTP 403. The Unix-socket proxy still accepts
  # /v2/proxy/filebrowser-quantum/... for platform compatibility.
  baseURL: "/filebrowser-quantum/ui/"
  trustProxyHeaders: true

server:
  # Do not contact the upstream update service. The wrapper publisher does not
  # operate that service, and disabling it keeps the shipped network behaviour
  # limited to the NAS and the browser session.
  disableUpdateCheck: true
  logging:
    - levels: "info|error|warning"
      output: "stdout"
  cacheDir: "/usr/local/filebrowser-quantum/data/cache"
  database:
    path: "/usr/local/filebrowser-quantum/data/filebrowser.sqlite"
  sources:
    - path: "/usr/local/filebrowser-quantum/data/files"
      name: "App Files"
      config:
        defaultEnabled: true
        defaultPermissions:
          view: true
          download: true
          modify: true
          delete: true
          create: true

auth:
  adminUsername: admin
  methods:
    password:
      enabled: true
      minLength: 5
      signup: false

frontend:
  name: "FileBrowser Quantum"
