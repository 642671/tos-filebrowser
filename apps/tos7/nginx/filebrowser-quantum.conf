# FileBrowser Quantum for TOS -- application route.
#
# TOS includes the *.conf files of this directory inside the main server
# block, so only location entries are allowed here; do not add a server block.
#
# The application deliberately does not use /v2/proxy/<appid>/ from the
# launcher iframe: a browser document navigation cannot attach the platform
# X-Csrf-Token header, and TOS answers that navigation with HTTP 403. This
# location serves the application through the normal portal origin instead.
# ^~ keeps a later regex location from taking the request away from the app.

location = /filebrowser-quantum/ui {
    absolute_redirect off;
    return 302 /filebrowser-quantum/ui/;
}

location ^~ /filebrowser-quantum/ui/ {
    proxy_pass http://127.0.0.1:18742;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    client_max_body_size 0;
}
