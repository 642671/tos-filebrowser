<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>FileBrowser Quantum</title>
  <link rel="stylesheet" href="./styles.css?v=2.0.5">
</head>
<body>
  <div id="loading" class="loading" role="status" aria-live="polite">
    <span class="spinner" aria-hidden="true"></span>
    <span>Loading FileBrowser Quantum...</span>
  </div>

  <iframe
    id="appFrame"
    class="app-frame"
    title="FileBrowser Quantum"
    src="/filebrowser-quantum/ui/?v=2.0.5"
    allow="clipboard-read; clipboard-write">
  </iframe>

  <div id="error" class="error" role="alert" hidden>
    <h1>FileBrowser Quantum is unavailable</h1>
    <p id="errorDetail">The application did not render. Check the service and its diagnostic log, then retry.</p>
    <p><button id="retry" type="button">Retry</button></p>
    <a id="openDirect" href="/filebrowser-quantum/ui/?v=2.0.5" target="_blank" rel="noopener">Open directly</a>
  </div>

  <script src="./app.js?v=2.0.5"></script>
</body>
</html>
